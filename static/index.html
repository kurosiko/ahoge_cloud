<!DOCTYPE html>
<html>
<head>
    <title>Go + HTMX Cloud</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="w-full text-center">
    <h1
        class="font-semibold text-3xl"
    >
        CloudStorage
    </h1>
    <button
        hx-get="/list"
        hx-target="#file-list"
        hx-swap="innerHTML"
        class="
        border-neutral-500
        border-2
        p-2.5
        "
    >
        Refresh 
    </button>
    <div
        class="
        flex
        w-full
        *:flex-1
        text-2xl
        divide-neutral-500
        gap-2.5
        "
    >
       <button>
           Upload
       </button>
       <button>
           Download
       </button>
    </div>

    <div id="file-list">
        Please Click the Refresh button
    </div>
</body>
</html>
